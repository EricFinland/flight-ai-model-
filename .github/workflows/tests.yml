name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The CPU build of torch first (~200 MB instead of ~2 GB of CUDA wheels);
      # `pip install -e` then finds torch already satisfied.
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: pip install -e '.[dev]'

      # The tests need no data, checkpoints or GPU: they build tiny tokenizers,
      # models and token files in temporary directories.
      - name: Run tests
        run: pytest -q
