# The run used for the first build: main and control trained in parallel on a
# 4-core CPU, 2 threads each, ~3 hours wall clock. See docs/training.md for
# the benchmark and the reasoning behind these numbers.
#   python scripts/train.py --config configs/cpu_pilot.yaml \
#       --data-dir /home/user/data/tokenized/main --out /home/user/data/runs/main --max-hours 3
model:
  vocab_size: 8192
  n_layer: 8
  n_head: 4                # head_dim 64
  d_model: 256
  d_ff: 704                # SwiGLU, ~8/3 * d_model rounded up to a multiple of 64
  max_seq_len: 512
  rope_theta: 10000.0
data:
  train_bin: /home/user/data/tokenized/main/train.bin
  val_bin: /home/user/data/tokenized/main/val.bin
  tokenizer: tokenizer/tokenizer.json
train:
  device: cpu
  dtype: fp32              # bf16 autocast is ~3x slower on this CPU (no AMX)
  threads: 2
  compile: false           # measured +3% only, with a 40 s compile; not worth the risk
  seed: 1903
  micro_batch: 8           # 8 x 512 = 4096 tokens per forward/backward
  grad_accum: 4            # 16,384 tokens per optimizer step
  max_steps: 950           # ~15.6M tokens: planned for ~1,600 tok/s per run, 3 h, 10% margin
  warmup_steps: 50
  lr: 2.0e-3
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_interval: 5
  eval_interval: 50        # ~8-9 min at the planned speed; 16 x 4096 val tokens, ~15 s
  eval_batches: 16
  ckpt_interval: 50        # same steps as eval, so main/control compare at matched steps
