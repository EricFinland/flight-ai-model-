# Scaled-up recipe for one modern GPU (A100/H100 class): GPT-2-small sized,
# ~124M params, 1024 context. Untested here (no GPU in the build box).
# Compute-optimal is ~20 tokens/param = ~2.5B tokens; PG-19 pre-1903 main
# corpus is roughly 1.5-2B tokens with this tokenizer, so tokenize without a
# cap (tokenize_corpus.py --max-train-tokens 0) and expect ~1.5 epochs.
# 0.5M tokens/step x 5000 steps = 2.6B tokens; a few hours on one H100.
#   python scripts/train.py --config configs/gpu_125m.yaml \
#       --data-dir /data/tokenized/main --out runs/main_125m
model:
  vocab_size: 8192
  n_layer: 12
  n_head: 12
  d_model: 768
  d_ff: 2048
  max_seq_len: 1024
  rope_theta: 10000.0
data:
  train_bin: /home/user/data/tokenized/main/train.bin
  val_bin: /home/user/data/tokenized/main/val.bin
  tokenizer: tokenizer/tokenizer.json
train:
  device: cuda
  dtype: bf16
  compile: true
  seed: 1903
  micro_batch: 32          # 32 x 1024 = 32K tokens per micro-batch
  grad_accum: 16           # 512K tokens per optimizer step
  max_steps: 5000
  warmup_steps: 250
  lr: 6.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 250
  eval_batches: 32
  ckpt_interval: 500
