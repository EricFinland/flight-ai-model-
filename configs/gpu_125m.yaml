# Scaled-up recipe for one modern GPU (A100/H100 class): GPT-2-small width,
# 16 layers, 119.6M params, 1024 context. Untested here (no GPU in the build box).
# Compute-optimal is ~20 tokens/param = ~2.4B tokens; the PG-19 pre-1903 main
# corpus is ~1.7B tokens with this tokenizer, so tokenize without a cap
# (tokenize_corpus.py --max-train-tokens 0) and expect ~1.5 epochs.
# 0.5M tokens/step x 5000 steps = 2.6B tokens, ~2.1e18 FLOPs: roughly 2 h on
# one H100 or 6 h on one A100, per model (main and control each).
# Memory: ~2 GB of weights/grads/AdamW + ~25 GB of activations at micro_batch
# 32, so a 40 GB card is fine. On a 24 GB card add
# --set micro_batch=16 --set grad_accum=32 (same tokens per step).
# Several GPUs: torchrun --standalone --nproc_per_node N scripts/train.py ...
# (DDP; grad_accum must be divisible by N). See docs/scaling.md.
#   python scripts/train.py --config configs/gpu_125m.yaml \
#       --data-dir /data/tokenized/main --out runs/main_125m
model:
  vocab_size: 8192
  n_layer: 16
  n_head: 12
  d_model: 768
  d_ff: 2048
  max_seq_len: 1024
  rope_theta: 10000.0
data:
  train_bin: /home/user/data/tokenized/main/train.bin
  val_bin: /home/user/data/tokenized/main/val.bin
  tokenizer: tokenizer/tokenizer.json
train:
  device: cuda
  dtype: bf16
  compile: true
  seed: 1903
  micro_batch: 32          # 32 x 1024 = 32K tokens per micro-batch
  grad_accum: 16           # 512K tokens per optimizer step
  max_steps: 5000
  warmup_steps: 250
  lr: 6.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 250
  eval_batches: 32
  ckpt_interval: 500
