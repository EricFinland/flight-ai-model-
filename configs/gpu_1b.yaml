# Scaled-up recipe for a 1.23B-param model (d=2048, 24 layers, 2048 context).
# Untested here (no GPU in the build box). fp32 master weights + grads + AdamW
# state are ~20 GB; activations at micro-batch 8 (16K tokens) are ~40 GB
# without torch.compile, less with it, so it needs one 80 GB GPU (A100/H100
# 80GB) per process. If it runs out of memory, use
# --set micro_batch=4 --set grad_accum=128 (same tokens per step).
# ~6.7e19 FLOPs: roughly 2-3 days on one H100 per model, or ~7-9 h on
# 8 x H100 with DDP: torchrun --standalone --nproc_per_node 8 scripts/train.py ...
# (grad_accum 64 / 8 GPUs = 8 micro-batches per GPU per step). FSDP is not
# built in, and not needed at this size. See docs/scaling.md.
# Data is the binding constraint: pre-1903 English in PG-19 is ~2B tokens, far
# below the ~24B compute-optimal for 1.2B params, so this config deliberately
# trains several epochs (8B tokens = ~4 epochs). Larger pre-1903 corpora
# (newspapers, HathiTrust/Internet Archive scans) would be the real upgrade.
#   python scripts/train.py --config configs/gpu_1b.yaml \
#       --data-dir /data/tokenized/main --out runs/main_1b
model:
  vocab_size: 8192
  n_layer: 24
  n_head: 16
  d_model: 2048
  d_ff: 5504
  max_seq_len: 2048
  rope_theta: 10000.0
data:
  train_bin: /home/user/data/tokenized/main/train.bin
  val_bin: /home/user/data/tokenized/main/val.bin
  tokenizer: tokenizer/tokenizer.json
train:
  device: cuda
  dtype: bf16
  compile: true
  seed: 1903
  micro_batch: 8           # 8 x 2048 = 16K tokens per micro-batch
  grad_accum: 64           # 1M tokens per optimizer step
  max_steps: 8000          # 8.4B tokens
  warmup_steps: 500
  lr: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 500
  eval_batches: 32
  ckpt_interval: 1000
